name: Auto-Update Fastfetch

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write   # required to dispatch the build workflow

# Never let two update runs race on the same bot branch.
concurrency:
  group: auto-update-fastfetch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new upstream release
        id: check
        run: |
          CURRENT=$(grep -oP 'FASTFETCH_VERSION=\K[0-9.]+' fastfetch/version.mk)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          LATEST=$(gh api repos/fastfetch-cli/fastfetch/releases/latest --jq '.tag_name' | sed 's/^v//')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Already up to date ($CURRENT)"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "New version available: $CURRENT -> $LATEST"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update version and hash
        if: steps.check.outputs.up_to_date == 'false'
        id: update
        run: |
          VERSION="${{ steps.check.outputs.latest }}"

          # Download tarball and compute SHA256
          HASH=$(curl -fsSL "https://codeload.github.com/fastfetch-cli/fastfetch/tar.gz/${VERSION}" | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Computed SHA256: $HASH"

          # Update version.mk
          sed -i "s/^FASTFETCH_VERSION=.*/FASTFETCH_VERSION=${VERSION}/" fastfetch/version.mk

          # Update Makefile fallback version and hash
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=\$(or \$(FASTFETCH_VERSION),${VERSION})/" fastfetch/Makefile
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${HASH}/" fastfetch/Makefile

          echo "Updated version.mk and Makefile"

      - name: Open, merge and build pull request
        if: steps.check.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.latest }}
          HASH: ${{ steps.update.outputs.hash }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH="auto-update-fastfetch-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add fastfetch/version.mk fastfetch/Makefile
          git commit -m "chore: update fastfetch to ${VERSION}"

          # This branch is bot-owned and always regenerated from the base
          # branch, so force-push is required: the branch of a previous run
          # still exists (and points at a different commit) whenever the
          # previous PR has not been merged yet, which makes a plain push
          # fail with "non-fast-forward".
          git push --force origin "$BRANCH"

          # Reuse the already open PR instead of failing on "a pull request
          # for branch ... already exists".
          PR=$(gh pr list --head "$BRANCH" --base "$BASE" --state open \
                 --json number --jq '.[0].number // 0')
          if [ "$PR" = "0" ]; then
            gh pr create \
              --title "chore: update fastfetch to ${VERSION}" \
              --body "Auto-update fastfetch to upstream version **${VERSION}**.

          | | |
          |---|---|
          | Version | \`${VERSION}\` |
          | SHA256 | \`${HASH}\` |" \
              --base "$BASE" \
              --head "$BRANCH"
            PR=$(gh pr view "$BRANCH" --json number --jq '.number')
          fi

          # GitHub computes "mergeable" asynchronously, so a merge issued
          # right after the push may fail for a moment. Retry instead of
          # leaving the update pending until the next scheduled run.
          merged=0
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$PR" --merge; then
              merged=1
              break
            fi
            echo "Merge attempt ${attempt} failed, retrying in 5s..."
            sleep 5
          done
          if [ "$merged" != "1" ]; then
            echo "::error::Could not merge PR #$PR for ${VERSION}"
            exit 1
          fi
          echo "Merged PR #$PR (${VERSION})"

          # The head branch is not needed anymore.
          git push origin --delete "$BRANCH" || true

          # Pushes/PRs created with GITHUB_TOKEN do not trigger other
          # workflows, so the build must be dispatched explicitly
          # (workflow_dispatch is the documented exception).
          gh workflow run build.yml \
            --ref "$BASE" \
            -f tag="$VERSION" \
            -f "text=Auto-update fastfetch to upstream v${VERSION}"
          echo "Dispatched build.yml for ${VERSION}"
